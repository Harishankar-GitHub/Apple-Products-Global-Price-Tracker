# Weekly pull requests to keep pinned versions current; each ecosystem's updates come as one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
