# Weekly pull requests to keep pinned versions current; each ecosystem's updates come as one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements-dev.txt also lists the API's packages (-r api/requirements.txt), which
    # the /api entry above already updates: only the test tools are updated from here.
    allow:
      - dependency-name: pytest
      - dependency-name: ruff
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
