<!DOCTYPE html>
<!--
  Source of docs/og.png, the image shown when a link to the site is shared
  (WhatsApp, Slack, X, LinkedIn, iMessage…). To change it, edit this file and
  save a 1200 × 630 screenshot over docs/og.png, for example:

    npx playwright screenshot --viewport-size "1200,630" assets/og-image.html docs/og.png

  The rows on the right are an illustration, not real prices.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Social preview — Apple Global Price Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1d1d1f;
    background:
      radial-gradient(620px 420px at 8% 0%,    rgba(0,113,227,.13), transparent 70%),
      radial-gradient(560px 420px at 100% 100%, rgba(26,158,92,.12), transparent 70%),
      #f5f5f7;
    display: flex; align-items: center; gap: 56px;
    padding: 0 64px 0 76px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Left: what it is ── */
  .intro { flex: 1 1 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #e3e3e8; border-radius: 999px;
    padding: 9px 18px 9px 12px; font-size: 22px; font-weight: 600; color: #0071e3;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  .pill .apple { font-size: 26px; line-height: 1; }
  h1 {
    font-family: "Inter Display", Inter, -apple-system, "SF Pro Display", sans-serif;
    font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -2.4px;
    margin-top: 30px;
  }
  h1 span { color: #0071e3; }
  .sub { margin-top: 26px; font-size: 28px; line-height: 1.35; color: #6e6e73; font-weight: 450; max-width: 520px; }

  /* ── Right: what a result looks like ── */
  .card {
    flex: 0 0 470px;
    background: #fff; border-radius: 26px; padding: 26px 28px 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.05);
    border: 1px solid #ececf0;
  }
  .card-head {
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: #8e8e93;
    padding-bottom: 12px; border-bottom: 1px solid #ececf0;
  }
  .row { display: grid; grid-template-columns: 36px 40px 1fr 118px; align-items: center; column-gap: 12px; padding: 15px 0; }
  .row + .row { border-top: 1px solid #f0f0f3; }
  .rank { font-size: 26px; text-align: center; line-height: 1; }
  .rank.n { font-size: 20px; font-weight: 700; color: #8e8e93; }
  .flag { font-size: 32px; line-height: 1; }
  .name { font-size: 24px; font-weight: 600; }
  .bar { margin-top: 9px; height: 6px; border-radius: 6px; background: #e8e8ed; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; background: #0071e3; }
  .row.cheapest .bar i { background: #1a9e5c; }
  .tag { font-size: 20px; font-weight: 700; text-align: right; justify-self: end; }
  .tag.best { background: #e6f4ea; color: #1a9e5c; border-radius: 10px; padding: 6px 12px; font-size: 18px; }
  .tag.low  { color: #1a9e5c; }
  .tag.mid  { color: #e0951a; }
  .tag.high { color: #d93025; }
</style>
</head>
<body>
  <section class="intro">
    <div class="pill"><span class="apple">🍎</span>50 countries · live prices</div>
    <h1>Apple Global<br><span>Price Tracker</span></h1>
    <p class="sub">Find the cheapest country to buy any iPhone, Mac, iPad or AirPods.</p>
  </section>

  <section class="card" aria-label="Example: prices by country, cheapest first">
    <div class="card-head"><span>Country</span><span>vs cheapest</span></div>
    <div class="row cheapest"><span class="rank">🥇</span><span class="flag">🇯🇵</span>
      <div><div class="name">Japan</div><div class="bar"><i style="width:74%"></i></div></div><span class="tag best">Cheapest</span></div>
    <div class="row"><span class="rank">🥈</span><span class="flag">🇺🇸</span>
      <div><div class="name">United States</div><div class="bar"><i style="width:77%"></i></div></div><span class="tag low">+4%</span></div>
    <div class="row"><span class="rank">🥉</span><span class="flag">🇨🇦</span>
      <div><div class="name">Canada</div><div class="bar"><i style="width:81%"></i></div></div><span class="tag mid">+9%</span></div>
    <div class="row"><span class="rank n">4</span><span class="flag">🇮🇪</span>
      <div><div class="name">Ireland</div><div class="bar"><i style="width:91%"></i></div></div><span class="tag high">+23%</span></div>
    <div class="row"><span class="rank n">5</span><span class="flag">🇮🇳</span>
      <div><div class="name">India</div><div class="bar"><i style="width:96%"></i></div></div><span class="tag high">+30%</span></div>
  </section>
</body>
</html>
